[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "mgvs"
version = "0.1.0"
description = "Markov-Guided Verified Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mgvs = "mgvs.cli.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgvs"]
