[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgvs"
version = "0.1.0"
description = "Markov-Guided Verified Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mgvs = "mgvs.cli.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
